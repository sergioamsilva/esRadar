nota: Instituições-mãe (o campo «grupo» do crosswalk de estabelecimentos, com a Técnica de
  Lisboa já somada à Universidade de Lisboa) e a sua sede, para as séries regionais de 30 anos.
  Litoral = distritos de Viana do Castelo, Braga, Porto, Aveiro, Coimbra, Leiria, Santarém,
  Lisboa, Setúbal e Faro; interior = Bragança, Vila Real, Viseu, Guarda, Castelo Branco,
  Portalegre, Évora e Beja; ilhas = Açores e Madeira. Curado à mão.
