nota: Famílias de cursos por nome, para as séries de 30 anos (a área CNAEF só existe para os
  cursos de 2026). Os padrões são expressões regulares sobre o nome normalizado (minúsculas,
  sem acentos nem pontuação); a ordem conta — ganha a primeira família que bater. Curado à
  mão; o que não bate cai em «Outros».
