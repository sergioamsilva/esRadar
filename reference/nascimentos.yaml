nota: Nados-vivos em Portugal por ano (INE, Estatísticas Vitais), transcritos da tabela
  «Estatísticas vitais desde 1900» de pt.wikipedia.org/wiki/Demografia_de_Portugal em
  2026-09-02. Servem para pôr as vagas de cada ano ao lado da geração que faz 18 anos
  nesse ano (nascidos 18 anos antes). Conferir na fonte primária antes de citar.
fonte: INE — Estatísticas Vitais (via Wikipédia, «Demografia de Portugal»)
